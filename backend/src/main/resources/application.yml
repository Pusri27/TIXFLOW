server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

spring:
  application:
    name: ticketing-backend
  profiles:
    active: dev
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${DB_USER:admin}
    password: ${DB_PASS:secretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 10000
      initialization-fail-timeout: -1
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
  flyway:
    enabled: false

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-64-char-hex-jwt-secret-key-for-local-dev}
    expiration: 86400000 # 24 hours
  booking:
    lock-ttl-minutes: 10
    expiry-minutes: 10
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo_key}
    api-secret: ${CLOUDINARY_API_SECRET:demo_secret}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_mock_key}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_mock_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}
